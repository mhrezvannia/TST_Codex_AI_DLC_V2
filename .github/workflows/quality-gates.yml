name: Quality Gates

on:
  pull_request:
    branches: [main, integ/main-reconciled]
  push:
    branches: [main, integ/main-reconciled]
  workflow_dispatch:

jobs:
  quality-gates:
    name: W1 quality gates
    runs-on: [self-hosted, on-prem, linux]
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    env:
      POSTGRES_HOST_PORT: "55432"
      GRAFANA_HOST_PORT: "3003"
      MESSAGING_REQUIRE_REAL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack yarn install --immutable

      - name: Backend service tests
        run: mvn -f services/pom.xml -q test

      - name: Workspace script tests
        run: node --test scripts/w1-live-acceptance.test.mjs scripts/replay-restart-proof.test.mjs scripts/local-readiness.test.mjs scripts/run-quality-gates.test.mjs scripts/seed-local.test.mjs

      - name: Booking frontend tests
        run: corepack yarn workspace @erp/app-booking test

      - name: Booking frontend typecheck
        run: corepack yarn workspace @erp/app-booking typecheck

      - name: Booking frontend lint
        run: corepack yarn workspace @erp/app-booking lint

      - name: Booking frontend build
        run: corepack yarn workspace @erp/app-booking build

      - name: Compose static validation
        run: docker compose config --quiet

      - name: W1 live acceptance dry run
        run: node scripts/w1-live-acceptance.mjs --dry-run --run-id ci-dry-run

      - name: Run quality gate aggregator
        run: node scripts/run-quality-gates.mjs --all --evidence artifacts/quality-gates/evidence.json

      - name: Run local readiness evidence
        if: always()
        run: node scripts/local-readiness.mjs --evidence artifacts/readiness/local-readiness.json

      - name: Run AI-DLC audit detector
        run: bash .claude/skills/aidlc-audit/detectors.sh | tee artifacts/quality-gates/aidlc-audit.txt

      - name: Run ERP fidelity detector
        run: bash .claude/skills/erp-fidelity-audit/detectors.sh | tee artifacts/quality-gates/erp-fidelity-audit.txt

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-evidence
          path: |
            artifacts/quality-gates/evidence.json
            artifacts/readiness/local-readiness.json
            artifacts/contracts-live-verification.json
            artifacts/seed-apply-attempt.json
            artifacts/w1-01-live/ci-dry-run/**
            artifacts/quality-gates/*.txt
