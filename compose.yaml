name: linercore-shared-platform

services:
  postgres:
    image: postgres:15
    profiles: ["core", "app", "devtools", "full"]
    env_file:
      - ./infrastructure/env/local.env.example
    environment:
      POSTGRES_USER: linercore
      POSTGRES_PASSWORD: linercore_local
      POSTGRES_DB: linercore
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ./infrastructure/database/00-local-bootstrap.sh:/docker-entrypoint-initdb.d/00-local-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linercore"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    profiles: ["core", "app", "devtools", "full"]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://127.0.0.1:8080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/linercore-local-realm.json:/opt/keycloak/data/import/linercore-local-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    profiles: ["core", "app", "devtools", "full"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    profiles: ["core", "app", "devtools", "full"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  identity-service:
    image: linercore/identity-service:local
    build:
      context: .
      dockerfile: infrastructure/docker/spring-service.Dockerfile
      args:
        JAR_FILE: services/identity-service/container/target/identity-container-0.1.0-SNAPSHOT.jar
    profiles: ["app", "full"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linercore_identity
      SPRING_DATASOURCE_USERNAME: linercore_identity
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  reference-data-service:
    image: linercore/reference-data-service:local
    build:
      context: .
      dockerfile: infrastructure/docker/spring-service.Dockerfile
      args:
        JAR_FILE: services/reference-data-service/container/target/reference-data-container-0.1.0-SNAPSHOT.jar
    profiles: ["app", "full"]
    environment:
      SPRING_PROFILES_ACTIVE: local,kafka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linercore_reference_data
      SPRING_DATASOURCE_USERNAME: linercore_reference_data
      SPRING_DATASOURCE_PASSWORD: ${REFERENCE_DATA_DB_PASSWORD:-reference_data_local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MESSAGING_REQUIRE_REAL: "true"
      REFERENCE_DATA_EVENTS_TOPIC: referencedata.events
      REFERENCE_DATA_BOOKING_TOKEN: ${REFERENCE_DATA_BOOKING_TOKEN:-reference_data_booking_local_token}
      REFERENCE_DATA_BFF_TOKEN: ${REFERENCE_DATA_BFF_TOKEN:-reference_data_bff_local_token}
      REFERENCE_DATA_SEED_TOKEN: ${REFERENCE_DATA_SEED_TOKEN:-reference_data_seed_local_token}
      REFERENCE_DATA_CMM_TOKEN: ${REFERENCE_DATA_CMM_TOKEN:-reference_data_cmm_local_token}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  charge-agreement-service:
    image: linercore/charge-agreement-service:local
    build:
      context: .
      dockerfile: infrastructure/docker/spring-service.Dockerfile
      args:
        JAR_FILE: services/charge-agreement-service/container/target/charge-agreement-container-0.1.0-SNAPSHOT.jar
    profiles: ["app", "full"]
    environment:
      SPRING_PROFILES_ACTIVE: local,kafka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linercore_pricing
      SPRING_DATASOURCE_USERNAME: linercore_pricing
      SPRING_DATASOURCE_PASSWORD: ${PRICING_DB_PASSWORD:-pricing_local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MESSAGING_REQUIRE_REAL: "true"
      CHARGE_AGREEMENT_EVENTS_TOPIC: charge-agreement.events
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      reference-data-service:
        condition: service_started
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  booking-service:
    image: linercore/booking-service:local
    build:
      context: .
      dockerfile: infrastructure/docker/spring-service.Dockerfile
      args:
        JAR_FILE: services/booking-service/container/target/booking-container-0.1.0-SNAPSHOT.jar
    profiles: ["app", "full"]
    environment:
      SPRING_PROFILES_ACTIVE: local,kafka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linercore_booking
      SPRING_DATASOURCE_USERNAME: linercore_booking
      SPRING_DATASOURCE_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_local}
      BOOKING_SERVICE_TOKEN: ${BOOKING_SERVICE_TOKEN:-booking_local_service_token}
      IDENTITY_SERVICE_URL: http://identity-service:8082
      REFERENCE_DATA_SERVICE_URL: http://reference-data-service:8083
      REFERENCE_DATA_CLIENT_ID: booking-service
      REFERENCE_DATA_BOOKING_TOKEN: ${REFERENCE_DATA_BOOKING_TOKEN:-reference_data_booking_local_token}
      CHARGE_AGREEMENT_SERVICE_URL: http://charge-agreement-service:8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MESSAGING_REQUIRE_REAL: "true"
      BOOKING_EVENTS_TOPIC: booking.events
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    depends_on:
      postgres:
        condition: service_healthy
      reference-data-service:
        condition: service_started
      charge-agreement-service:
        condition: service_started
      identity-service:
        condition: service_started
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  container-movement-service:
    image: linercore/container-movement-service:local
    build:
      context: .
      dockerfile: infrastructure/docker/spring-service.Dockerfile
      args:
        JAR_FILE: services/container-movement-service/container/target/container-movement-container-0.1.0-SNAPSHOT.jar
    profiles: ["app", "full"]
    environment:
      SPRING_PROFILES_ACTIVE: local,kafka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linercore_container_movement
      SPRING_DATASOURCE_USERNAME: linercore_container_movement
      SPRING_DATASOURCE_PASSWORD: ${CONTAINER_MOVEMENT_DB_PASSWORD:-container_movement_local}
      REFERENCE_DATA_SERVICE_URL: http://reference-data-service:8083
      REFERENCE_DATA_CMM_TOKEN: ${REFERENCE_DATA_CMM_TOKEN:-reference_data_cmm_local_token}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MESSAGING_REQUIRE_REAL: "true"
      CONTAINER_MOVEMENT_EVENTS_TOPIC: containermovement.status
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      reference-data-service:
        condition: service_started
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  seed-loader:
    image: node:24-alpine
    profiles: ["app", "full"]
    working_dir: /workspace
    env_file:
      - ./infrastructure/env/local.env.example
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8082
      REFERENCE_DATA_SERVICE_URL: http://reference-data-service:8083
      REFERENCE_DATA_SEED_TOKEN: ${REFERENCE_DATA_SEED_TOKEN:-reference_data_seed_local_token}
      CHARGE_AGREEMENT_SERVICE_URL: http://charge-agreement-service:8084
      BOOKING_SERVICE_URL: http://booking-service:8085
      CONTAINER_MOVEMENT_SERVICE_URL: http://container-movement-service:8086
    command:
      - "node"
      - "scripts/seed-local.mjs"
      - "--wait"
      - "--seed-file"
      - "/workspace/infrastructure/seeds/shared-platform-mvp-defaults.json"
    volumes:
      - ./:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      identity-service:
        condition: service_started
      reference-data-service:
        condition: service_started
      charge-agreement-service:
        condition: service_started
      booking-service:
        condition: service_started
      container-movement-service:
        condition: service_started

  apps-auth:
    image: linercore/apps-auth:local
    build:
      context: .
      dockerfile: infrastructure/docker/next-app.Dockerfile
      args:
        WORKSPACE: "@erp/app-auth"
    profiles: ["app", "full"]
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8082
      AUTH_LOCAL_SUBJECT_ID: ${AUTH_LOCAL_SUBJECT_ID:-local.booking.user}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-http://127.0.0.1:8088/auth/api/auth/callback}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-http://127.0.0.1:8088}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-linercore-local-session-secret}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8080}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://127.0.0.1:8080/realms/linercore-local}
    depends_on:
      - identity-service

  apps-shell:
    image: linercore/apps-shell:local
    build:
      context: .
      dockerfile: infrastructure/docker/next-app.Dockerfile
      args:
        WORKSPACE: "@erp/app-shell"
    profiles: ["app", "full"]
    environment:
      BOOKING_APP_URL: http://apps-booking:3000
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-linercore-local-session-secret}
    ports:
      - "${SHELL_APP_HOST_PORT:-3004}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    depends_on:
      - apps-auth
      - apps-booking

  apps-reference-data:
    image: linercore/apps-reference-data:local
    build:
      context: .
      dockerfile: infrastructure/docker/next-app.Dockerfile
      args:
        WORKSPACE: "@erp/app-reference-data"
    profiles: ["app", "full"]
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8082
      REFERENCE_DATA_SERVICE_URL: http://reference-data-service:8083
      REFERENCE_DATA_BFF_TOKEN: ${REFERENCE_DATA_BFF_TOKEN:-reference_data_bff_local_token}
    ports:
      - "${REFERENCE_DATA_UI_HOST_PORT:-3002}:3000"
    depends_on:
      - reference-data-service
      - identity-service

  apps-charge-agreements:
    image: linercore/apps-charge-agreements:local
    build:
      context: .
      dockerfile: infrastructure/docker/next-app.Dockerfile
      args:
        WORKSPACE: "@erp/app-charge-agreements"
    profiles: ["app", "full"]
    environment:
      CHARGE_AGREEMENT_SERVICE_URL: http://charge-agreement-service:8084
    depends_on:
      - charge-agreement-service

  apps-booking:
    image: linercore/apps-booking:local
    build:
      context: .
      dockerfile: infrastructure/docker/next-app.Dockerfile
      args:
        WORKSPACE: "@erp/app-booking"
    profiles: ["app", "full"]
    environment:
      BOOKING_SERVICE_URL: http://booking-service:8085
      BOOKING_SERVICE_TOKEN: ${BOOKING_SERVICE_TOKEN:-booking_local_service_token}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-linercore-local-session-secret}
    ports:
      - "${BOOKING_APP_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/bookings"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    depends_on:
      booking-service:
        condition: service_healthy

  apps-container-movement:
    image: linercore/apps-container-movement:local
    build:
      context: .
      dockerfile: infrastructure/docker/next-app.Dockerfile
      args:
        WORKSPACE: "@erp/app-container-movement"
    profiles: ["app", "full"]
    environment:
      CONTAINER_MOVEMENT_SERVICE_URL: http://container-movement-service:8086
      BOOKING_SERVICE_URL: http://booking-service:8085
    depends_on:
      - container-movement-service
      - booking-service

  nginx:
    image: nginx:1.27
    ports:
      - "8088:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - apps-shell
      - apps-auth
      - apps-reference-data
      - apps-charge-agreements
      - apps-booking
      - apps-container-movement
    profiles: ["app", "full"]

  contract-devtools:
    image: node:24-alpine
    profiles: ["devtools", "full"]
    working_dir: /workspace
    command: ["sh", "-c", "node --version && sleep infinity"]
    volumes:
      - ./contracts:/workspace/contracts:ro
      - ./scripts:/workspace/scripts:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles: ["observability", "full"]

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "${GRAFANA_HOST_PORT:-3003}:3000"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
    profiles: ["observability", "full"]

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    ports:
      - "16686:16686"
      - "${JAEGER_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_HOST_PORT:-4318}:4318"
    profiles: ["observability", "full"]

  otel-collector:
    image: otel/opentelemetry-collector:0.114.0
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "${OTEL_GRPC_HOST_PORT:-4319}:4317"
      - "${OTEL_HTTP_HOST_PORT:-4320}:4318"
    volumes:
      - ./infrastructure/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - jaeger
    profiles: ["observability", "full"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    profiles: ["observability", "full"]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.16.1
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    depends_on:
      - elasticsearch
    profiles: ["observability", "full"]

networks:
  default:
    name: linercore-local
