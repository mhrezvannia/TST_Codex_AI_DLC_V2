<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowback" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M8 1L2 5L8 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="720" fill="#FAF9F5"/>

  <text x="80" y="46" font-size="19" font-weight="700" fill="#2C2C2A">LinerCore — DDD context map</text>

  <!-- ===== External upstream (top) ===== -->
  <g font-size="12.5" fill="#2C2C2A">
    <rect x="120" y="72" width="195" height="64" rx="8" fill="#ECEAE3" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="217" y="98" text-anchor="middle">Identity provider</text>
    <text x="217" y="116" text-anchor="middle">(OIDC)</text>

    <rect x="345" y="72" width="195" height="64" rx="8" fill="#ECEAE3" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="442" y="98" text-anchor="middle">Vessel schedule</text>
    <text x="442" y="116" text-anchor="middle">source</text>

    <rect x="565" y="72" width="195" height="64" rx="8" fill="#ECEAE3" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="662" y="98" text-anchor="middle">EDI / INTTRA</text>
    <text x="662" y="116" text-anchor="middle">booking networks</text>

    <rect x="950" y="72" width="210" height="64" rx="8" fill="#ECEAE3" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="1055" y="98" text-anchor="middle">Terminals / depots /</text>
    <text x="1055" y="116" text-anchor="middle">leasing (EDI)</text>
  </g>

  <!-- ===== Platform container ===== -->
  <rect x="90" y="170" width="1110" height="390" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="110" y="200" font-size="15" font-weight="700" fill="#2C2C2A">LinerCore platform</text>
  <text x="110" y="221" font-size="12" fill="#5F5E5A">Shared Platform layer underlies all three (reference data &#183; identity &#183; event bus)</text>

  <!-- ===== Internal contexts ===== -->
  <rect x="130" y="300" width="300" height="110" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="280" y="349" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Charge &amp; Customer</text>
  <text x="280" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Agreement</text>

  <rect x="495" y="300" width="300" height="110" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="645" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Customer Booking</text>

  <rect x="860" y="300" width="300" height="110" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="1010" y="349" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">Container Movement</text>
  <text x="1010" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">Management</text>

  <!-- ===== Internal edges ===== -->
  <!-- Charge <-> Booking (sync pricing) -->
  <line x1="431" y1="360" x2="494" y2="360" stroke="#5F5E5A" stroke-width="1.6" marker-start="url(#arrowback)" marker-end="url(#arrow)"/>
  <text x="462" y="351" text-anchor="middle" font-size="12" fill="#444441">C/S</text>

  <!-- Booking <-> CMM (PL events) -->
  <line x1="796" y1="360" x2="859" y2="360" stroke="#5F5E5A" stroke-width="1.6" marker-start="url(#arrowback)" marker-end="url(#arrow)"/>
  <text x="827" y="351" text-anchor="middle" font-size="12" fill="#444441">PL</text>

  <!-- CMM -> Charge (dwell/return drives D&D) -->
  <path d="M940 410 C 940 488, 300 488, 300 410" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="560" y="508" text-anchor="middle" font-size="12" fill="#444441">PL &#183; dwell/return &#8594; D&amp;D</text>

  <!-- ===== External upstream edges into platform/contexts ===== -->
  <line x1="217" y1="137" x2="217" y2="169" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="217" y="158" text-anchor="middle" font-size="12" fill="#444441">Conformist</text>

  <line x1="442" y1="137" x2="442" y2="169" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="442" y="158" text-anchor="middle" font-size="12" fill="#444441">ACL</text>

  <line x1="662" y1="137" x2="648" y2="299" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="690" y="212" text-anchor="start" font-size="12" fill="#444441">ACL</text>

  <line x1="1055" y1="137" x2="1015" y2="299" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1080" y="212" text-anchor="start" font-size="12" fill="#444441">ACL</text>

  <!-- ===== External downstream (bottom) ===== -->
  <g font-size="12.5" fill="#2C2C2A">
    <rect x="540" y="610" width="220" height="64" rx="8" fill="#ECEAE3" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="650" y="646" text-anchor="middle">External finance / ERP</text>

    <rect x="905" y="610" width="250" height="64" rx="8" fill="#ECEAE3" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="1030" y="636" text-anchor="middle">Customers</text>
    <text x="1030" y="654" text-anchor="middle">(DCSA track &amp; trace)</text>
  </g>

  <line x1="648" y1="411" x2="650" y2="609" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="664" y="525" text-anchor="start" font-size="12" fill="#444441">ACL &#183; invoice</text>

  <line x1="1015" y1="411" x2="1030" y2="609" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1046" y="525" text-anchor="start" font-size="12" fill="#444441">OHS &#183; DCSA</text>

  <!-- ===== Legend ===== -->
  <rect x="90" y="600" width="430" height="92" rx="8" fill="#F6F4EE" stroke="#B4B2A9" stroke-width="1"/>
  <text x="106" y="622" font-size="12" font-weight="700" fill="#2C2C2A">Legend</text>
  <text x="106" y="643" font-size="11.5" fill="#444441">OHS = Open Host Service &#183; PL = Published Language</text>
  <text x="106" y="661" font-size="11.5" fill="#444441">ACL = Anti-Corruption Layer &#183; Conformist = accept model as-is</text>
  <text x="106" y="679" font-size="11.5" fill="#444441">C/S = Customer/Supplier &#183; arrowhead points to downstream</text>
</svg>
