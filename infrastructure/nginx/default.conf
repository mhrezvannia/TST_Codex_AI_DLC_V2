server {
  listen 80;
  absolute_redirect off;

  # Trusted-header policy (snippets/trusted-headers.conf) is applied to the W4-owned
  # locations only: /reference-data/ and /charge-agreements. It is NOT yet applied to
  # /auth, /bookings, /booking, /api/bookings, or /, because those paths depend on
  # headers the policy clears:
  #   - apps/booking/lib/bookings.ts and apps/shell/lib/booking-client.ts read
  #     `idempotency-key` from the inbound request, which the policy clears.
  # Extending the policy to those locations requires their owners to stop taking that
  # value from the browser first. Tracked as a cross-team follow-up rather than applied
  # here, because clearing the header without that change breaks Booking mutations.

  location /auth-assets/ {
    rewrite ^/auth-assets/(.*)$ /$1 break;
    proxy_pass http://apps-auth:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location /auth/ {
    rewrite ^/auth/(.*)$ /$1 break;
    proxy_pass http://apps-auth:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location = /reference-data {
    return 308 /reference-data/;
  }

  location /reference-data/ {
    proxy_pass http://apps-reference-data:3000/;
    include /etc/nginx/snippets/trusted-headers.conf;
  }

  location = /charge-agreements {
    proxy_pass http://apps-charge-agreements:3000;
    include /etc/nginx/snippets/trusted-headers.conf;
  }

  location ^~ /charge-agreements/ {
    proxy_pass http://apps-charge-agreements:3000;
    include /etc/nginx/snippets/trusted-headers.conf;
  }

  location /health {
    return 200 "ok\n";
  }

  location = /favicon.ico {
    access_log off;
    return 204;
  }

  location = /bookings {
    proxy_pass http://apps-booking:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location /bookings/ {
    proxy_pass http://apps-booking:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location /booking-assets/ {
    rewrite ^/booking-assets/(.*)$ /$1 break;
    proxy_pass http://apps-booking:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location = /api/bookings {
    proxy_pass http://apps-booking:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location /api/bookings/ {
    proxy_pass http://apps-booking:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location = /booking {
    proxy_pass http://apps-shell:3000/booking;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location /booking/ {
    proxy_pass http://apps-shell:3000/booking/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location / {
    proxy_pass http://apps-shell:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }
}
