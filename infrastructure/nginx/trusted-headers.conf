# Platform-owned trusted-header policy for public edge locations.
#
# Contract: component-methods.md "Canonical Shell and Edge Contract".
# Clear the inbound trust headers a browser must never be able to assert, then set
# the five values the edge alone is entitled to supply.
#
# Include this INSIDE a `location` block:
#     location /reference-data/ {
#       proxy_pass http://apps-reference-data:3000/;
#       include /etc/nginx/snippets/trusted-headers.conf;
#     }
#
# Note on the eleven/five split: four of the eleven cleared headers
# (X-Correlation-Id, X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Proto) are
# cleared *by being overwritten* with the trusted value below — setting them after
# an inbound value discards it. The remaining seven have no trusted counterpart and
# are cleared explicitly. Net effect is the eleven-cleared / five-set policy.
#
# Internal BFF-to-service calls do not traverse a public location and therefore do
# not receive this policy; they construct their own trust headers.

# --- cleared: no trusted counterpart -----------------------------------------
proxy_set_header Authorization "";
proxy_set_header Idempotency-Key "";
proxy_set_header X-Actor-Subject "";
proxy_set_header X-Actor-Subject-Id "";
proxy_set_header X-LinerCore-Service-Id "";
proxy_set_header X-LinerCore-Service-Token "";
proxy_set_header X-LinerCore-Subject-Assertion "";

# --- set: the five values the edge owns --------------------------------------
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Correlation-Id $request_id;
