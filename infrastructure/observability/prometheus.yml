global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: apps-auth
    metrics_path: /api/health
    static_configs:
      - targets: ["apps-auth:3000"]
  - job_name: apps-reference-data
    metrics_path: /api/health
    static_configs:
      - targets: ["apps-reference-data:3000"]
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8082"]
  - job_name: reference-data-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["reference-data-service:8083"]
  - job_name: charge-agreement-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["charge-agreement-service:8084"]
  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["booking-service:8085"]
  - job_name: container-movement-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["container-movement-service:8086"]
